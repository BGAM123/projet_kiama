<svg viewBox="0 0 1560 1280" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1560" height="1280" fill="#ffffff"/>

  <text x="780" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#23266E">Architecture — Création d'un Document &amp; assistance IA</text>
  <text x="780" y="54" text-anchor="middle" font-size="13" fill="#64748B">De la sélection d'un gabarit à l'export, avec relecture IA toujours optionnelle</text>

  <!-- legend -->
  <g font-size="12" fill="#334155">
    <rect x="70" y="70" width="12" height="12" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="4,3"/>
    <text x="88" y="80">Action / UI utilisateur</text>
    <rect x="270" y="70" width="12" height="12" rx="3" fill="#F1F5F9" stroke="#475569"/>
    <text x="288" y="80">Traitement backend</text>
    <rect x="450" y="70" width="12" height="12" rx="3" fill="#E6F7F5" stroke="#0F9488"/>
    <text x="468" y="80">Transformation déterministe</text>
    <rect x="680" y="70" width="12" height="12" rx="3" fill="#EEF0FC" stroke="#3338B5"/>
    <text x="698" y="80">Appel IA</text>
    <rect x="800" y="70" width="12" height="12" rx="3" fill="#ECFDF3" stroke="#16A34A"/>
    <text x="818" y="80">Accepté</text>
    <rect x="900" y="70" width="12" height="12" rx="3" fill="#FFF7ED" stroke="#EA580C"/>
    <text x="918" y="80">Rejeté</text>
  </g>

  <!-- ================= MAIN SPINE (centerX=545) ================= -->
  <!-- M1 -->
  <rect x="310" y="140" width="470" height="70" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="5,4" filter="url(#shadow2)"/>
  <text x="545" y="169" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">DocumentType actif sélectionné</text>
  <text x="545" y="188" text-anchor="middle" font-size="11.5" fill="#475569">/documents/new — onglet « À partir d'un type »</text>

  <!-- M2 -->
  <rect x="310" y="240" width="470" height="70" rx="10" fill="#F1F5F9" stroke="#475569" filter="url(#shadow2)"/>
  <text x="545" y="269" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">POST /documents</text>
  <text x="545" y="288" text-anchor="middle" font-size="11.5" fill="#1E293B">DocumentService.create</text>

  <!-- M3a / M3b -->
  <rect x="310" y="350" width="225" height="100" rx="10" fill="#E6F7F5" stroke="#0F9488" filter="url(#shadow2)"/>
  <text x="422" y="376" text-anchor="middle" font-size="12" font-weight="700" fill="#0B5F58">DocumentSkeletonHtmlBuilder</text>
  <text x="422" y="394" text-anchor="middle" font-size="10.5" fill="#0B5F58">.build(tree)</text>
  <text x="422" y="411" text-anchor="middle" font-size="10.5" fill="#0B5F58">→ Document.contentHtml</text>
  <text x="422" y="428" text-anchor="middle" font-size="10.5" fill="#0B5F58">(HTML éditable, tables pré-remplies)</text>

  <rect x="555" y="350" width="225" height="100" rx="10" fill="#E6F7F5" stroke="#0F9488" filter="url(#shadow2)"/>
  <text x="667" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#0B5F58">flatten(tree)</text>
  <text x="667" y="400" text-anchor="middle" font-size="10.5" fill="#0B5F58">→ DocumentSection[]</text>
  <text x="667" y="417" text-anchor="middle" font-size="10.5" fill="#0B5F58">statut = EMPTY</text>
  <text x="667" y="434" text-anchor="middle" font-size="10" font-style="italic" fill="#0F766E">(support de l'assistance IA)</text>

  <!-- M4 editor -->
  <rect x="310" y="480" width="470" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="5,4" filter="url(#shadow2)"/>
  <text x="545" y="512" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Éditeur Word-like (WYSIWYG)</text>
  <text x="545" y="531" text-anchor="middle" font-size="11.5" fill="#475569">/documents/{id} — l'utilisateur rédige le contenu</text>

  <!-- Alt import branch -->
  <rect x="30" y="480" width="250" height="90" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="5,4" filter="url(#shadow2)"/>
  <text x="155" y="503" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Chemin alternatif</text>
  <text x="155" y="520" text-anchor="middle" font-size="10.5" fill="#475569">Import direct d'un fichier</text>
  <text x="155" y="535" text-anchor="middle" font-size="10.5" fill="#475569">(sans DocumentType, pas de sections)</text>
  <text x="155" y="550" text-anchor="middle" font-size="10.5" fill="#475569">DocxHtmlImporter / Tika</text>

  <!-- Mfinal -->
  <rect x="310" y="1150" width="470" height="90" rx="10" fill="#F1F5F9" stroke="#475569" filter="url(#shadow2)"/>
  <text x="545" y="1177" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Finalisation &amp; export</text>
  <text x="545" y="1195" text-anchor="middle" font-size="11" fill="#1E293B">DocumentService.finalizeDocument / export</text>
  <text x="545" y="1212" text-anchor="middle" font-size="11" fill="#1E293B">→ DOCX / PDF / Markdown → stockage MinIO</text>

  <!-- ================= AI ASSIST GROUP ================= -->
  <rect x="850" y="470" width="680" height="610" rx="14" fill="none" stroke="#3338B5" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="1190" y="500" text-anchor="middle" font-size="14.5" font-weight="700" fill="#23266E">Assistance IA pendant la rédaction (toujours opt-in)</text>

  <!-- Triggers -->
  <rect x="880" y="530" width="260" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="5,4" filter="url(#shadow2)"/>
  <text x="1010" y="565" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Sélection libre de texte</text>

  <rect x="1190" y="530" width="290" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="5,4" filter="url(#shadow2)"/>
  <text x="1335" y="565" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Section entière (déjà rédigée)</text>

  <!-- AI calls -->
  <rect x="880" y="630" width="260" height="100" rx="10" fill="#EEF0FC" stroke="#3338B5" filter="url(#shadow2)"/>
  <text x="1010" y="654" text-anchor="middle" font-size="12" font-weight="700" fill="#23266E">DocumentController</text>
  <text x="1010" y="670" text-anchor="middle" font-size="11" fill="#23266E">.improveSelection</text>
  <text x="1010" y="687" text-anchor="middle" font-size="11" fill="#23266E">→ GenerationOrchestrator</text>
  <text x="1010" y="704" text-anchor="middle" font-size="10.5" font-style="italic" fill="#23266E">suggestion éphémère (non persistée)</text>
  <text x="1010" y="719" text-anchor="middle" font-size="10.5" fill="#23266E">SectionSuggestionDTO</text>

  <rect x="1190" y="630" width="290" height="100" rx="10" fill="#EEF0FC" stroke="#3338B5" filter="url(#shadow2)"/>
  <text x="1335" y="652" text-anchor="middle" font-size="12" font-weight="700" fill="#23266E">DocumentSectionService.improve</text>
  <text x="1335" y="668" text-anchor="middle" font-size="11" fill="#23266E">→ GenerationOrchestrator</text>
  <text x="1335" y="684" text-anchor="middle" font-size="10.5" fill="#23266E">(buildSectionImprovementSystemPrompt)</text>
  <text x="1335" y="700" text-anchor="middle" font-size="10.5" fill="#23266E">→ aiSuggestedContent</text>
  <text x="1335" y="716" text-anchor="middle" font-size="10.5" fill="#23266E">+ confidenceScore (en attente)</text>

  <!-- Diff -->
  <rect x="1010" y="770" width="340" height="70" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="2" filter="url(#shadow2)"/>
  <text x="1180" y="798" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">SectionSuggestionDiff</text>
  <text x="1180" y="817" text-anchor="middle" font-size="11.5" fill="#334155">Affichage avant / après, décision explicite</text>

  <!-- Outcomes -->
  <rect x="880" y="880" width="260" height="90" rx="10" fill="#ECFDF3" stroke="#16A34A" filter="url(#shadow2)"/>
  <text x="1010" y="904" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532D">Accepter</text>
  <text x="1010" y="922" text-anchor="middle" font-size="10.5" fill="#166534">apply-suggestion</text>
  <text x="1010" y="938" text-anchor="middle" font-size="10.5" fill="#166534">userContent mis à jour</text>
  <text x="1010" y="954" text-anchor="middle" font-size="10.5" fill="#166534">statut = AI_IMPROVED (historisé)</text>

  <rect x="1190" y="880" width="290" height="90" rx="10" fill="#FFF7ED" stroke="#EA580C" filter="url(#shadow2)"/>
  <text x="1335" y="904" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A3412">Rejeter</text>
  <text x="1335" y="922" text-anchor="middle" font-size="10.5" fill="#9A3412">reject-suggestion</text>
  <text x="1335" y="938" text-anchor="middle" font-size="10.5" fill="#9A3412">suggestion effacée</text>
  <text x="1335" y="954" text-anchor="middle" font-size="10.5" fill="#9A3412">texte utilisateur conservé</text>

  <text x="1190" y="1030" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">↺ répétable pour chaque section, autant de fois que nécessaire avant la finalisation</text>

  <!-- ================= ARROWS ================= -->
  <g stroke="#64748B" stroke-width="2" fill="none">
    <line x1="545" y1="210" x2="545" y2="240" marker-end="url(#arrow2)"/>
    <line x1="490" y1="310" x2="440" y2="350" marker-end="url(#arrow2)"/>
    <line x1="600" y1="310" x2="650" y2="350" marker-end="url(#arrow2)"/>
    <line x1="440" y1="450" x2="490" y2="480" marker-end="url(#arrow2)"/>
    <line x1="650" y1="450" x2="600" y2="480" marker-end="url(#arrow2)"/>
    <line x1="280" y1="525" x2="310" y2="520" marker-end="url(#arrow2)"/>
    <line x1="545" y1="560" x2="545" y2="1150" marker-end="url(#arrow2)"/>

    <line x1="780" y1="510" x2="1010" y2="530" marker-end="url(#arrow2)"/>
    <line x1="780" y1="530" x2="1335" y2="530" marker-end="url(#arrow2)"/>

    <line x1="1010" y1="590" x2="1010" y2="630" marker-end="url(#arrow2)"/>
    <line x1="1335" y1="590" x2="1335" y2="630" marker-end="url(#arrow2)"/>
    <line x1="1050" y1="730" x2="1130" y2="770" marker-end="url(#arrow2)"/>
    <line x1="1310" y1="730" x2="1230" y2="770" marker-end="url(#arrow2)"/>
    <line x1="1130" y1="840" x2="1010" y2="880" marker-end="url(#arrow2)"/>
    <line x1="1230" y1="840" x2="1335" y2="880" marker-end="url(#arrow2)"/>
  </g>
</svg>
